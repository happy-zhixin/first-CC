<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  :root {
    color-scheme: light;
    --bg:        #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --line:      #e1e0d9;
    --axis:      #c3c2b7;
    --focus:     #e34948;   /* 专注 = 番茄红 */
    --short:     #1baf7a;   /* 短休 = 绿 */
    --long:      #4a3aa7;   /* 长休 = 紫 */
    --bar:       #2a78d6;   /* 柱状图 = 蓝 */
    --bar-today: #1c5cab;
    --shadow:    0 10px 30px rgba(11,11,11,0.08);
    --ring-track: #ebeae3;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:        #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --line:      #2c2c2a;
    --axis:      #383835;
    --focus:     #e66767;
    --short:     #199e70;
    --long:      #9085e9;
    --bar:       #3987e5;
    --bar-today: #6da7ec;
    --shadow:    0 10px 30px rgba(0,0,0,0.45);
    --ring-track: #2c2c2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.3s, color 0.3s;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px 28px 24px;
    transition: background 0.3s, border-color 0.3s;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--line); color: var(--ink); }

  /* ---------- 模式选项卡 ---------- */
  .tabs {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    border: none;
    background: transparent;
    border-radius: 9px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .tab.active {
    color: var(--mode);
    background: var(--surface);
    box-shadow: 0 1px 4px rgba(11,11,11,0.08);
  }

  /* ---------- 计时环 ---------- */
  .ring-wrap { position: relative; width: 260px; margin: 0 auto 24px; }
  .ring { display: block; width: 100%; height: auto; }
  .ring-track { fill: none; stroke: var(--ring-track); stroke-width: 12; }
  .ring-fill {
    fill: none;
    stroke: var(--mode);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke 0.3s, stroke-dashoffset 0.2s linear;
  }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .time {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .mode-label { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--mode); }
  .today-hint { margin-top: 4px; font-size: 12px; color: var(--muted); }

  /* ---------- 控制按钮 ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 28px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-round {
    width: 48px; height: 48px;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-round:hover { background: var(--line); color: var(--ink); }
  .btn-main {
    min-width: 132px;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--mode);
    border-color: transparent;
    letter-spacing: 2px;
    transition: background 0.3s, transform 0.1s;
  }
  .btn-main:hover { filter: brightness(1.06); }

  /* ---------- 统计 ---------- */
  .stats {
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }
  .stat-tiles { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-tile {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-label { margin-top: 2px; font-size: 12px; color: var(--muted); }

  .chart-title { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
  .chart-bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    height: 120px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    min-width: 0;
  }
  .bar-val { font-size: 12px; color: var(--ink-2); height: 18px; font-variant-numeric: tabular-nums; }
  .bar {
    width: 100%;
    max-width: 30px;
    border-radius: 4px 4px 0 0;
    background: var(--bar);
    transition: height 0.4s ease;
  }
  .bar.today { background: var(--bar-today); }
  .bar.zero { background: var(--axis); }
  .bar-label { margin-top: 6px; font-size: 12px; color: var(--muted); }

  /* ---------- 设置弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(11,11,11,0.4);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .modal h2 { font-size: 17px; margin-bottom: 20px; }
  .field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .field label { font-size: 14px; color: var(--ink-2); }
  .field input[type="number"] {
    width: 68px;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    text-align: center;
  }
  .field input[type="number"]:focus { outline: none; border-color: var(--bar); }
  .unit { margin-left: 6px; font-size: 13px; color: var(--muted); }

  .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
  .switch input { display: none; }
  .slider {
    position: absolute; inset: 0;
    background: var(--axis);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute; left: 3px; top: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .switch input:checked + .slider { background: var(--bar); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions .btn { flex: 1; padding: 11px 0; font-size: 14px; font-weight: 600; }
  .btn-primary { background: var(--bar); color: #fff; border-color: transparent; }
  .btn-primary:hover { filter: brightness(1.06); }

  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">🍅 番茄钟</div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="切换深浅色">🌙</button>
      <button class="icon-btn" id="openSettings" title="设置">⚙</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-mode="focus">专注</button>
    <button class="tab" data-mode="short">短休</button>
    <button class="tab" data-mode="long">长休</button>
  </div>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 260 260">
      <circle class="ring-track" cx="130" cy="130" r="120"></circle>
      <circle class="ring-fill" id="ringFill" cx="130" cy="130" r="120"></circle>
    </svg>
    <div class="ring-center">
      <div class="time" id="time">25:00</div>
      <div class="mode-label" id="modeLabel">专注</div>
      <div class="today-hint" id="todayHint"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-round" id="btnReset" title="重置 (R)">↺</button>
    <button class="btn btn-main" id="btnStart">开 始</button>
    <button class="btn btn-round" id="btnSkip" title="跳过 (S)">⏭</button>
  </div>

  <div class="stats">
    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="stat-num" id="todayCount">0</div>
        <div class="stat-label">今日番茄</div>
      </div>
      <div class="stat-tile">
        <div class="stat-num" id="totalCount">0</div>
        <div class="stat-label">累计番茄</div>
      </div>
    </div>
    <div class="chart-title">近 7 天完成数</div>
    <div class="chart-bars" id="chart"></div>
  </div>

  <div class="hint">空格 开始/暂停 · R 重置 · S 跳过</div>
</div>

<!-- 设置弹窗 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>设置</h2>
    <div class="field">
      <label for="setFocus">专注时长</label>
      <div><input type="number" id="setFocus" min="1" max="180" step="1"><span class="unit">分钟</span></div>
    </div>
    <div class="field">
      <label for="setShort">短休息</label>
      <div><input type="number" id="setShort" min="1" max="60" step="1"><span class="unit">分钟</span></div>
    </div>
    <div class="field">
      <label for="setLong">长休息</label>
      <div><input type="number" id="setLong" min="1" max="90" step="1"><span class="unit">分钟</span></div>
    </div>
    <div class="field">
      <label for="setLongEvery">长休息间隔</label>
      <div><input type="number" id="setLongEvery" min="2" max="12" step="1"><span class="unit">个番茄</span></div>
    </div>
    <div class="field">
      <label for="setSound">声音提醒</label>
      <span class="switch"><input type="checkbox" id="setSound"><span class="slider"></span></span>
    </div>
    <div class="field">
      <label for="setAutoStart">自动开始下一段</label>
      <span class="switch"><input type="checkbox" id="setAutoStart"><span class="slider"></span></span>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelSettings">取消</button>
      <button class="btn btn-primary" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 常量与状态 ----------
  var SETTINGS_KEY = "pomodoro.settings";
  var STATS_KEY = "pomodoro.stats";
  var SESSION_KEY = "pomodoro.session";

  var DEFAULT_SETTINGS = {
    focus: 25, short: 5, long: 15, longEvery: 4,
    sound: true, autoStart: false, theme: "auto"
  };

  var MODE_VAR = { focus: "var(--focus)", short: "var(--short)", long: "var(--long)" };
  var MODE_LABEL = { focus: "专注", short: "短休息", long: "长休息" };

  var R = 120;
  var CIRC = 2 * Math.PI * R;

  var settings = loadJSON(SETTINGS_KEY, DEFAULT_SETTINGS);
  var stats = loadJSON(STATS_KEY, {});
  var session = loadJSON(SESSION_KEY, { mode: "focus", running: false, endAt: null, remaining: 0, cycle: 0 });

  // 数值兜底，防止旧数据缺字段
  if (typeof session.remaining !== "number") session.remaining = 0;
  if (typeof session.cycle !== "number") session.cycle = 0;
  if (!MODE_VAR[session.mode]) session.mode = "focus";

  var audioCtx = null;

  // ---------- DOM ----------
  var el = {
    time: document.getElementById("time"),
    modeLabel: document.getElementById("modeLabel"),
    todayHint: document.getElementById("todayHint"),
    ringFill: document.getElementById("ringFill"),
    tabs: document.getElementById("tabs"),
    btnStart: document.getElementById("btnStart"),
    btnReset: document.getElementById("btnReset"),
    btnSkip: document.getElementById("btnSkip"),
    todayCount: document.getElementById("todayCount"),
    totalCount: document.getElementById("totalCount"),
    chart: document.getElementById("chart"),
    themeToggle: document.getElementById("themeToggle"),
    openSettings: document.getElementById("openSettings"),
    overlay: document.getElementById("settingsOverlay"),
    cancelSettings: document.getElementById("cancelSettings"),
    saveSettings: document.getElementById("saveSettings"),
    setFocus: document.getElementById("setFocus"),
    setShort: document.getElementById("setShort"),
    setLong: document.getElementById("setLong"),
    setLongEvery: document.getElementById("setLongEvery"),
    setSound: document.getElementById("setSound"),
    setAutoStart: document.getElementById("setAutoStart")
  };

  // ---------- 工具 ----------
  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var v = JSON.parse(raw);
      return v && typeof v === "object" ? v : fallback;
    } catch (e) { return fallback; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function dateKey(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function todayKey() { return dateKey(new Date()); }

  function totalSeconds(mode) {
    if (mode === "focus") return settings.focus * 60;
    if (mode === "short") return settings.short * 60;
    return settings.long * 60;
  }

  function rawRemaining() {
    if (session.running && session.endAt) {
      return (session.endAt - Date.now()) / 1000;
    }
    return session.remaining;
  }

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  // ---------- 声音 ----------
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function playChime() {
    if (!settings.sound) return;
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var notes = [523.25, 659.25, 783.99]; // C5 E5 G5
    notes.forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      var t = now + i * 0.18;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.55);
    });
  }

  // ---------- 计时逻辑 ----------
  function start() {
    ensureAudio();
    var rem = rawRemaining();
    if (rem <= 0) rem = totalSeconds(session.mode);
    session.running = true;
    session.remaining = Math.ceil(rem);
    session.endAt = Date.now() + rem * 1000;
    saveSession();
    render();
  }

  function pause() {
    session.remaining = Math.max(0, Math.ceil(rawRemaining()));
    session.running = false;
    session.endAt = null;
    saveSession();
    render();
  }

  function reset() {
    session.running = false;
    session.endAt = null;
    session.remaining = totalSeconds(session.mode);
    saveSession();
    render();
  }

  function switchTo(mode) {
    session.mode = mode;
    session.remaining = totalSeconds(mode);
    session.running = settings.autoStart;
    session.endAt = session.running ? Date.now() + session.remaining * 1000 : null;
    saveSession();
  }

  function nextModeAfter(mode) {
    if (mode === "focus") {
      return (session.cycle > 0 && session.cycle % settings.longEvery === 0) ? "long" : "short";
    }
    return "focus";
  }

  function complete(silent) {
    if (session.mode === "focus") {
      var k = todayKey();
      stats[k] = (stats[k] || 0) + 1;
      session.cycle += 1;
      saveJSON(STATS_KEY, stats);
    }
    var next = nextModeAfter(session.mode);
    switchTo(next);
    if (!silent) playChime();
    render();
  }

  function skip() {
    switchTo(nextModeAfter(session.mode));
    render();
  }

  function tick() {
    if (session.running) {
      if (rawRemaining() <= 0) {
        complete(false);
        return;
      }
    }
    render();
  }

  function saveSession() { saveJSON(SESSION_KEY, session); }

  // ---------- 渲染 ----------
  function render() {
    var total = totalSeconds(session.mode);
    var rem = Math.max(0, Math.min(total, rawRemaining()));
    var elapsed = total - rem;

    document.documentElement.style.setProperty("--mode", MODE_VAR[session.mode]);
    el.ringFill.style.strokeDasharray = CIRC.toFixed(2);
    el.ringFill.style.strokeDashoffset = (CIRC * elapsed / total).toFixed(2);

    el.time.textContent = fmt(rem);
    el.modeLabel.textContent = MODE_LABEL[session.mode];
    el.btnStart.textContent = session.running ? "暂 停" : "开 始";
    el.btnStart.style.background = MODE_VAR[session.mode];

    var today = stats[todayKey()] || 0;
    el.todayHint.textContent = "今日已完成 " + today + " 个番茄";
    el.todayCount.textContent = today;
    el.totalCount.textContent = totalPomodoros();

    renderTabs();
    renderChart();

    document.title = session.running
      ? fmt(rem) + " · " + MODE_LABEL[session.mode] + " — 番茄钟"
      : "番茄钟";
  }

  function renderTabs() {
    var tabs = el.tabs.querySelectorAll(".tab");
    tabs.forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-mode") === session.mode);
    });
  }

  function totalPomodoros() {
    return Object.keys(stats).reduce(function (sum, k) { return sum + (stats[k] || 0); }, 0);
  }

  function renderChart() {
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var label = i === 0 ? "今" : ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
      days.push({ key: dateKey(d), label: label, today: i === 0, count: stats[dateKey(d)] || 0 });
    }
    var max = Math.max.apply(null, days.map(function (x) { return x.count; }).concat([1]));

    el.chart.innerHTML = "";
    days.forEach(function (d) {
      var col = document.createElement("div");
      col.className = "bar-col";

      var val = document.createElement("span");
      val.className = "bar-val";
      val.textContent = d.count > 0 ? String(d.count) : "";

      var bar = document.createElement("div");
      bar.className = "bar" + (d.today ? " today" : "") + (d.count === 0 ? " zero" : "");
      var h = d.count === 0 ? 4 : Math.max(8, Math.round((d.count / max) * 72));
      bar.style.height = h + "px";
      bar.title = d.key + "：" + d.count + " 个";

      var lbl = document.createElement("span");
      lbl.className = "bar-label";
      lbl.textContent = d.label;

      col.appendChild(val);
      col.appendChild(bar);
      col.appendChild(lbl);
      el.chart.appendChild(col);
    });
  }

  // ---------- 主题 ----------
  function applyTheme() {
    var dark = settings.theme === "dark" ||
      (settings.theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    el.themeToggle.textContent = dark ? "☀️" : "🌙";
  }
  function toggleTheme() {
    var dark = document.documentElement.dataset.theme === "dark";
    settings.theme = dark ? "light" : "dark";
    saveJSON(SETTINGS_KEY, settings);
    applyTheme();
  }

  // ---------- 设置弹窗 ----------
  function openSettings() {
    el.setFocus.value = settings.focus;
    el.setShort.value = settings.short;
    el.setLong.value = settings.long;
    el.setLongEvery.value = settings.longEvery;
    el.setSound.checked = settings.sound;
    el.setAutoStart.checked = settings.autoStart;
    el.overlay.classList.add("open");
  }
  function closeSettings() { el.overlay.classList.remove("open"); }
  function saveSettings() {
    settings.focus = clampInt(el.setFocus.value, 1, 180, 25);
    settings.short = clampInt(el.setShort.value, 1, 60, 5);
    settings.long = clampInt(el.setLong.value, 1, 90, 15);
    settings.longEvery = clampInt(el.setLongEvery.value, 2, 12, 4);
    settings.sound = el.setSound.checked;
    settings.autoStart = el.setAutoStart.checked;
    saveJSON(SETTINGS_KEY, settings);
    // 未运行时，让当前段时长跟随新设置
    if (!session.running) session.remaining = totalSeconds(session.mode);
    closeSettings();
    render();
  }
  function clampInt(v, min, max, def) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return def;
    return Math.max(min, Math.min(max, n));
  }

  // ---------- 事件 ----------
  el.btnStart.addEventListener("click", function () { session.running ? pause() : start(); });
  el.btnReset.addEventListener("click", reset);
  el.btnSkip.addEventListener("click", skip);

  el.tabs.addEventListener("click", function (e) {
    var t = e.target.closest(".tab");
    if (!t) return;
    session.mode = t.getAttribute("data-mode");
    session.running = false;
    session.endAt = null;
    session.remaining = totalSeconds(session.mode);
    saveSession();
    render();
  });

  el.themeToggle.addEventListener("click", toggleTheme);
  el.openSettings.addEventListener("click", openSettings);
  el.cancelSettings.addEventListener("click", closeSettings);
  el.saveSettings.addEventListener("click", saveSettings);
  el.overlay.addEventListener("click", function (e) {
    if (e.target === el.overlay) closeSettings();
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); session.running ? pause() : start(); }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "s" || e.key === "S") skip();
  });

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    if (settings.theme === "auto") applyTheme();
  });

  // ---------- 启动 ----------
  // 初始化：若上次是运行中状态
  if (session.running && session.endAt && session.endAt <= Date.now()) {
    complete(true); // 静默结算一次（离屏期间到期）
  }
  if (!session.remaining && !session.running) {
    session.remaining = totalSeconds(session.mode);
  }

  applyTheme();
  render();
  setInterval(tick, 200);
})();
</script>
</body>
</html>
